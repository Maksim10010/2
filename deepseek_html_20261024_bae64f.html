<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEURAL CRAFT</title>
<style>
  :root { --bg: #050505; --neon-green: #39ff14; --neon-purple: #bc13fe; --text: #e0e0e0; }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
  body {
    background-color: var(--bg);
    background-image: linear-gradient(rgba(57, 255, 20, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(57, 255, 20, 0.05) 1px, transparent 1px);
    background-size: 30px 30px; color: var(--text); padding: 20px;
  }
  .hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border: 2px solid var(--neon-purple); box-shadow: 0 0 20px var(--neon-purple) inset; border-radius: 15px; padding: 40px 20px; max-width: 900px; margin: 0 auto; }
  h1 { font-size: clamp(2rem, 6vw, 4rem); text-transform: uppercase; letter-spacing: 5px; color: #fff; text-shadow: 0 0 10px var(--neon-green), 0 0 20px var(--neon-green); margin-bottom: 20px; }
  p.sub { font-size: 1.1rem; color: var(--neon-green); margin-bottom: 50px; max-width: 600px; }
  
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; width: 100%; margin-top: 40px; }
  .card { border: 1px solid var(--neon-green); padding: 30px 20px; background: rgba(57, 255, 20, 0.05); border-radius: 10px; transition: all 0.3s ease; cursor: crosshair; }
  .card:hover { background: rgba(57, 255, 20, 0.2); box-shadow: 0 0 15px var(--neon-green); transform: scale(1.05); }
  .card h3 { color: var(--neon-purple); margin-bottom: 15px; text-shadow: 0 0 5px var(--neon-purple); }
  
  .btn-neon { margin-top: 40px; display: inline-block; padding: 15px 40px; color: var(--neon-green); border: 2px solid var(--neon-green); text-decoration: none; text-transform: uppercase; font-weight: bold; letter-spacing: 2px; transition: all 0.3s ease; }
  .btn-neon:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 20px var(--neon-green); }
</style>
</head>
<body>
  <div class="hero">
    <h1>Neural Craft</h1>
    <p class="sub">>> Автоматизация рутины. Генерация кода. ИИ-видео. <<</p>
    
    <div class="grid">
      <div class="card">
        <h3>Python Bots</h3>
        <p>Автоматизация процессов под ключ</p>
      </div>
      <div class="card">
        <h3>Vibe Coding</h3>
        <p>Сайты за 24 часа с помощью ИИ</p>
      </div>
      <div class="card">
        <h3>AI Content</h3>
        <p>Видео и графика для соцсетей</p>
      </div>
    </div>

    <a href="#" class="btn-neon">Инициализировать проект</a>
  </div>
</body>
</html>
